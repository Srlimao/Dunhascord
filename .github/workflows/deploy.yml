name: Build and Release Dunhascord

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup MSVC C++ Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Dependencies
        run: npm install

      - name: Compile Native Audio Loopback Engine
        run: cmd /c "scripts\compile-native.bat"

      - name: Build Web & Standalone Dist Package
        run: npm run build

      - name: Build Portable Electron App (.exe)
        run: npm run dist:electron

      - name: Package Dist into Zip
        run: Compress-Archive -Path dist\* -DestinationPath Dunhascord-Server-windows.zip -Force

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Dunhascord-Builds
          path: |
            Dunhascord-Server-windows.zip
            release-builds/*.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-builds/*.exe
            Dunhascord-Server-windows.zip
            src/bin/process_audio_capture.exe
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
